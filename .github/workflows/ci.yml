name: SAO Aincrad RPG CI (Build, Validate, Test & Secret Scan)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bytecode Compile Check
        run: |
          python -m compileall -q bot.py src tests

      - name: Validate SAO JSON Content & 100-Floor Schema
        run: |
          python -c "from src.rpg.content.loader import load_and_validate_all; load_and_validate_all()"

      - name: Run Full Pytest Suite
        run: |
          pytest -v
