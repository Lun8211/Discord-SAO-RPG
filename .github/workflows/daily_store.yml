name: VALORANT 每日商店推送 (Daily Store Notifier)

on:
  schedule:
    # 特戰英豪每日商店於 UTC 00:00 (台灣時間 08:00) 刷新
    # 設定於每日 UTC 00:05 (台灣時間 08:05) 自動執行
    - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      mock_mode:
        description: "使用範例造型測試 Discord 機器人發送 (不需 Riot Cookie)"
        required: false
        default: false
        type: boolean

jobs:
  send-daily-store:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch VALORANT Daily Store & Send to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RIOT_SSID: ${{ secrets.RIOT_SSID }}
          RIOT_COOKIES: ${{ secrets.RIOT_COOKIES }}
          RIOT_REGION: ${{ secrets.RIOT_REGION || 'ap' }}
          VALORANT_LANG: ${{ secrets.VALORANT_LANG || 'zh-TW' }}
        run: |
          if [ "${{ github.event.inputs.mock_mode }}" = "true" ]; then
            python main.py --mock
          else
            python main.py
          fi
