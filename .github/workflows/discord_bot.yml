name: 啟動星界紀元 RPG Discord 機器人 (Interactive RPG Bot)

on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "機器人維持上線的分鐘數（最長可填 350 分鐘）"
        required: false
        default: "30"
        type: string

# 最小權限：此 workflow 只需要讀取程式碼
permissions:
  contents: read

# 同時只允許一個機器人在線，新的執行會取代舊的，避免斜線指令被回應兩次
concurrency:
  group: discord-bot
  cancel-in-progress: true

jobs:
  run-discord-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Discord RPG Bot (/rpg)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TIMEZONE_OFFSET_HOURS: ${{ secrets.TIMEZONE_OFFSET_HOURS || '8' }}
          # RPG 永久存檔設定（設定 RPG_BACKUP_CHANNEL_ID 可在每次 Actions 重啟時自動還原與備份所有人進度）
          RPG_DB_PATH: ${{ secrets.RPG_DB_PATH || 'data/rpg.db' }}
          RPG_BACKUP_CHANNEL_ID: ${{ secrets.RPG_BACKUP_CHANNEL_ID }}
          RPG_BACKUP_INTERVAL_MINUTES: ${{ secrets.RPG_BACKUP_INTERVAL_MINUTES || '15' }}
          # 透過環境變數傳入 workflow 輸入值，避免直接把 ${{ }} 插入 shell 指令（script injection）
          RUN_MINUTES: ${{ inputs.run_minutes || '30' }}
        run: |
          python bot.py --run-minutes "$RUN_MINUTES"
